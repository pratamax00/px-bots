name: Build & Release PX Bots (Rust Static musl)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit tests
        run: cargo test --workspace --verbose

      - name: Build static release binaries (x86_64-musl)
        run: cargo build --workspace --release --target x86_64-unknown-linux-musl

      - name: Package & inspect release assets
        run: |
          mkdir -p dist
          for bin in px-media px-monitor px-notes px-mail px-abuse; do
            src="target/x86_64-unknown-linux-musl/release/${bin}"
            dst="dist/${bin}-linux-x86_64"
            cp "$src" "$dst"
            chmod +x "$dst"
            ls -lh "$dst"
            file "$dst"
            "$dst" --version
            (cd dist && sha256sum "${bin}-linux-x86_64" > "${bin}-linux-x86_64.sha256")
          done

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then
            TAG="latest"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "PX Bots ($TAG)" \
              --notes "Static x86_64-unknown-linux-musl release built from commit ${GITHUB_SHA::7}."
          fi
